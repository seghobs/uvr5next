<!-- Model Configuration - Extracted from #roformer, included on all pages -->
<div class="glass-card rounded-3xl p-6 border border-slate-800">
                        <h3 class="text-lg font-bold font-outfit text-white mb-6 flex items-center gap-2">
                            <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                            <span x-text="t('Model Configuration')">Model Configuration</span>
                        </h3>

                        <!-- Ensemble Mode Toggle -->
                        <div class="flex items-center justify-between p-4 bg-white/5 rounded-2xl border border-white/5 mb-6">
                            <div class="flex items-center gap-3">
                                <div :class="ensembleMode ? `bg-${accentColor}-500/20 text-${accentColor}-400` : 'bg-slate-800 text-slate-500'" class="p-2 rounded-xl transition-all">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                                </div>
                                <div>
                                    <p class="text-sm font-bold text-white" x-text="t('Ensemble Mode')">Ensemble Mode</p>
                                    <p class="text-[10px] text-slate-500 uppercase tracking-wider" x-text="t('Multi-Model Quality Boost')">Multi-Model Quality Boost</p>
                                </div>
                            </div>
                            <button @click="ensembleMode = !ensembleMode" 
                                    :class="ensembleMode ? `bg-${accentColor}-500` : 'bg-slate-800'"
                                    class="w-12 h-6 rounded-full relative transition-all duration-300">
                                <div :class="ensembleMode ? 'translate-x-6' : 'translate-x-1'" class="absolute top-1 w-4 h-4 bg-white rounded-full transition-transform duration-300 shadow-lg"></div>
                            </button>
                        </div>

                        <!-- Single Model Selection (Standard) -->
                        <div class="space-y-6" x-show="!ensembleMode" x-transition>
                            <div>
                                <label class="text-xs font-bold text-slate-500 uppercase tracking-widest block mb-2" x-text="t('Select Model')">Select Model</label>
                                                                <div class="relative" @click.away="configDropdownOpen = false">
                                    <button @click="configDropdownOpen = !configDropdownOpen" class="w-full bg-slate-800/50 border border-slate-700/50 rounded-2xl p-4 text-left text-slate-200 flex justify-between items-center hover:bg-slate-800 transition-all group">
                                        <div class="flex items-center gap-3 truncate">
                                            <div :class="`bg-${accentColor}-500/20 text-${accentColor}-400`" class="p-1.5 rounded-lg">
                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                                            </div>
                                            <span class="font-bold truncate" x-text="selectedModel || t('Choose a model...')"></span>
                                            <svg x-show="isFavorite(selectedModel)" class="w-4 h-4 text-amber-400 fill-amber-400 shrink-0 drop-shadow-[0_0_6px_rgba(251,191,36,0.6)]" viewBox="0 0 20 20" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                                        </div>
                                        <svg class="w-5 h-5 text-slate-500 transition-transform duration-300" :class="configDropdownOpen ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                    </button>
                                    <div x-show="configDropdownOpen" @click.stop class="absolute z-[100] mt-3 w-full bg-slate-900/95 backdrop-blur-2xl rounded-3xl border border-white/10 shadow-[0_20px_50px_rgba(0,0,0,0.5)] overflow-hidden max-h-80 flex flex-col">
                                        <div class="p-4 border-b border-white/5 bg-white/5 flex items-center gap-2">
                                            <input type="text" x-model="configDropdownSearch" @click.stop placeholder="Search..." class="w-full bg-slate-950/80 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white outline-none focus:ring-1 focus:ring-amber-400/50">
                                        </div>
                                        <div class="overflow-y-auto custom-scrollbar p-2">
                                            <!-- Fallback to roformer when on library/leaderboard (no models) -->
                                            <div x-show="!availableModels[currentTab] || availableModels[currentTab].length===0" class="px-4 py-2 text-xs text-amber-400/80 text-center">Showing Roformer models</div>
                                            <template x-for="m in getSortedModels(currentTab)" :key="m">
                                                <div @click="selectedModel = m; configDropdownOpen = false" 
                                                     :class="isFavorite(m) ? 'bg-amber-500/10 hover:bg-amber-500/20 border-l-2 border-amber-400 text-amber-100' : 'hover:bg-white/5 border-l-2 border-transparent text-slate-300 hover:text-white'"
                                                     class="px-3.5 py-2.5 rounded-xl cursor-pointer transition-all flex items-center justify-between group my-0.5">
                                                    <div class="flex items-center gap-2.5 truncate">
                                                        <!-- Favorite Star Button -->
                                                        <button type="button" 
                                                                @click.stop="toggleFavorite(m, $event)" 
                                                                class="p-1 rounded-lg hover:bg-white/10 transition-transform active:scale-125 focus:outline-none shrink-0"
                                                                :title="isFavorite(m) ? t('Remove from Favorites') : t('Add to Favorites')">
                                                            <svg class="w-4 h-4 transition-colors" 
                                                                 :class="isFavorite(m) ? 'text-amber-400 fill-amber-400 drop-shadow-[0_0_8px_rgba(251,191,36,0.6)]' : 'text-slate-600 group-hover:text-slate-400 hover:!text-amber-400'" 
                                                                 viewBox="0 0 20 20" fill="currentColor">
                                                                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                                                            </svg>
                                                        </button>
                                                        <span class="text-sm font-bold truncate" :class="isFavorite(m) ? 'text-amber-200' : ''" x-text="m"></span>
                                                        <span x-show="isFavorite(m)" class="text-[9px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 font-mono font-semibold shrink-0" x-text="t('FAVORITE')">FAVORITE</span>
                                                    </div>
                                                    <svg x-show="selectedModel === m" class="w-4 h-4 text-emerald-400 shrink-0 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- Model cache status -->
                            <div x-show="selectedModel" class="mt-2 flex items-center gap-2 text-xs">
                                <template x-if="modelStatus && modelStatus.cached">
                                    <span class="flex items-center gap-1.5 text-emerald-400 font-bold"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Cached ✓ <span class="text-slate-500 font-normal" x-text="`(${modelStatus.existing.length}/${modelStatus.total_files})`"></span></span>
                                </template>
                                <template x-if="modelStatus && !modelStatus.cached">
                                    <span class="flex items-center gap-1.5 text-amber-400 font-bold"><span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> Download required <span class="text-slate-500 font-normal" x-text="`(${modelStatus.existing.length}/${modelStatus.total_files} files)`"></span></span>
                                </template>
                                <button x-show="modelStatus && !modelStatus.cached && !isModelDownloading" @click="downloadCurrentModel()" class="ml-auto px-3 py-1 rounded-lg bg-amber-500/20 text-amber-400 border border-amber-500/30 hover:bg-amber-500/30 text-[10px] font-bold">⬇ Download</button>
                                <span x-show="isModelDownloading" class="ml-auto text-[10px] text-violet-400 animate-pulse" x-text="modelDownloadMessage || 'Downloading...'"></span>
                            </div>
                            <div x-show="isModelDownloading" class="mt-2 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                <div class="h-full bg-violet-500 transition-all" :style="`width: ${modelDownloadProgress*100}%`"></div>
                            </div>
                        </div>

                        <!-- Ensemble Multi-Selection UI (4 models, any type) -->
                        <div class="space-y-3" x-show="ensembleMode" x-transition>
                            <template x-for="(slot, idx) in ensembleModels" :key="idx">
                                <div class="space-y-1">
                                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1" x-text="`Model ${idx+1} ${idx===0 ? '(Primary)' : idx===1 ? '(Secondary)' : ''}`"></label>
                                    <select x-model="ensembleModels[idx].model_key" @change="ensembleModels[idx].model_type = getModelType(ensembleModels[idx].model_key)" 
                                            class="w-full bg-slate-900 border border-white/5 rounded-2xl p-2.5 text-sm text-white outline-none focus:ring-1 focus:ring-indigo-500">
                                        <option value="">Select model...</option>
                                        <optgroup label="Roformer">
                                            <template x-for="m in (availableModels['roformer'] || [])" :key="m"><option :value="m" x-text="m"></option></template>
                                        </optgroup>
                                        <optgroup label="MDX-Net">
                                            <template x-for="m in (availableModels['mdxnet'] || [])" :key="m"><option :value="m" x-text="m"></option></template>
                                        </optgroup>
                                        <optgroup label="MDX23C">
                                            <template x-for="m in (availableModels['mdx23c'] || [])" :key="m"><option :value="m" x-text="m"></option></template>
                                        </optgroup>
                                        <optgroup label="VR Arch">
                                            <template x-for="m in (availableModels['vrarch'] || [])" :key="m"><option :value="m" x-text="m"></option></template>
                                        </optgroup>
                                        <optgroup label="Demucs">
                                            <template x-for="m in (availableModels['demucs'] || [])" :key="m"><option :value="m" x-text="m"></option></template>
                                        </optgroup>
                                    </select>
                                </div>
                            </template>
                            <p class="text-[10px] text-slate-500">Select 2-4 models, they will be ensembled via amix. Empty slots ignored.</p>
                        </div>

                            <div>
                                <label class="text-sm font-medium text-slate-400 block mb-2" x-text="t('Output Format')">Output Format</label>
                                <div class="grid grid-cols-4 gap-2">
                                    <template x-for="fmt in formats" :key="fmt">
                                        <button 
                                            @click="outFormat = fmt"
                                            :class="outFormat === fmt ? 'bg-indigo-500 text-white border-indigo-400' : 'bg-slate-950/30 text-slate-500 border-slate-800 hover:border-slate-700'"
                                            class="px-2 py-2 rounded-lg border text-xs font-bold transition-all"
                                            x-text="fmt.toUpperCase()"
                                        ></button>
                                    </template>
                                </div>
                            </div>

                            <div class="h-px bg-slate-800/50"></div>

                            <!-- Segment Size (compact) -->
                            <div>
                                <div class="flex justify-between mb-2">
                                    <label class="text-sm font-medium text-slate-400" x-text="t('Segment Size')">Segment Size</label>
                                    <span class="text-sm font-bold text-indigo-400" x-text="params.segment_size"></span>
                                </div>
                                <input type="range" x-model="params.segment_size" min="32" max="1024" step="32" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                            </div>

                            <div>
                                <div class="flex justify-between mb-2">
                                    <label class="text-sm font-medium text-slate-400" x-text="t('Overlap')">Overlap</label>
                                    <span class="text-sm font-bold text-indigo-400" x-text="params.overlap"></span>
                                </div>
                                <input type="range" x-model="params.overlap" min="1" max="10" step="1" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                            </div>

                            <div class="flex items-center justify-between p-4 rounded-2xl bg-slate-950/30 border border-slate-800">
                                <div>
                                    <p class="text-sm font-bold text-slate-200" x-text="t('Denoise Output')">Denoise Output</p>
                                    <p class="text-xs text-slate-500" x-text="t('Clean artifacts')">Clean artifacts</p>
                                </div>
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" x-model="params.denoise" class="sr-only peer">
                                    <div class="w-11 h-6 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-slate-400 after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600 peer-checked:after:bg-white"></div>
                                </label>
                            </div>

                            <!-- Advanced (collapsible, keeps design compact as in screenshot) -->
                            <details class="group/adv">
                                <summary class="flex items-center justify-between cursor-pointer list-none p-3 rounded-xl bg-white/5 border border-white/5 hover:bg-white/10 transition-colors">
                                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest" x-text="t('Advanced Settings')">Advanced Settings</span>
                                    <svg class="w-4 h-4 text-slate-500 group-open/adv:rotate-180 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </summary>
                                <div class="mt-3 space-y-4 p-3 rounded-xl bg-slate-900/50 border border-white/5">
                                    <div class="grid grid-cols-2 gap-3">
                                        <div>
                                            <label class="text-xs text-slate-400">Batch Size</label>
                                            <input type="range" x-model.number="params.batch_size" min="1" max="16" step="1" class="w-full h-1 accent-indigo-500">
                                            <span class="text-xs text-indigo-400" x-text="params.batch_size"></span>
                                        </div>
                                        <div>
                                            <label class="text-xs text-slate-400">Hop Length</label>
                                            <input type="range" x-model.number="params.hop_length" min="32" max="2048" step="32" class="w-full h-1 accent-indigo-500">
                                            <span class="text-xs text-indigo-400" x-text="params.hop_length"></span>
                                        </div>
                                    </div>
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="text-xs text-slate-400">Normalization</label>
                                            <input type="range" x-model.number="params.normalization_threshold" min="0.1" max="1" step="0.1" class="w-full h-1 accent-indigo-500">
                                            <span class="text-xs text-indigo-400" x-text="params.normalization_threshold"></span>
                                        </div>
                                        <div>
                                            <label class="text-xs text-slate-400">Amplification</label>
                                            <input type="range" x-model.number="params.amplification_threshold" min="0.1" max="1" step="0.1" class="w-full h-1 accent-indigo-500">
                                            <span class="text-xs text-indigo-400" x-text="params.amplification_threshold"></span>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="text-xs font-medium text-slate-400">Single Stem</label>
                                        <input type="text" x-model="params.single_stem" placeholder="e.g. Vocals" class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none">
                                    </div>
                                    <div class="grid grid-cols-2 gap-2 text-xs">
                                        <label class="flex items-center gap-2 text-slate-400"><input type="checkbox" x-model="params.override_segment_size" class="rounded"> Override Seg</label>
                                        <label class="flex items-center gap-2 text-slate-400"><input type="checkbox" x-model="params.tta" class="rounded"> TTA</label>
                                        <label class="flex items-center gap-2 text-slate-400"><input type="checkbox" x-model="params.post_process" class="rounded"> Post Process</label>
                                        <label class="flex items-center gap-2 text-slate-400"><input type="checkbox" x-model="params.high_end_process" class="rounded"> High End</label>
                                        <label class="flex items-center gap-2 text-slate-400"><input type="checkbox" x-model="params.segments_enabled" class="rounded"> Seg Enabled</label>
                                    </div>
                                    <div class="grid grid-cols-3 gap-2">
                                        <div><label class="text-[10px] text-slate-500">Window</label><input type="range" x-model.number="params.window_size" min="320" max="1024" step="32" class="w-full h-1 accent-indigo-500"><span class="text-[10px] text-indigo-400" x-text="params.window_size"></span></div>
                                        <div><label class="text-[10px] text-slate-500">Aggression</label><input type="range" x-model.number="params.aggression" min="1" max="50" step="1" class="w-full h-1 accent-indigo-500"><span class="text-[10px] text-indigo-400" x-text="params.aggression"></span></div>
                                        <div><label class="text-[10px] text-slate-500">Shifts</label><input type="range" x-model.number="params.shifts" min="0" max="10" step="1" class="w-full h-1 accent-indigo-500"><span class="text-[10px] text-indigo-400" x-text="params.shifts"></span></div>
                                    </div>
                                </div>
                            </details>
                        </div>
                    </div>
